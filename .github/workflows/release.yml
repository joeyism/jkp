name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: build all platforms
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for spec in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${spec%/*}"
            arch="${spec#*/}"
            name="jkp-${os}-${arch}"
            echo "building $name (version $version)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "-X github.com/joey/jkp/internal/cli.Version=${version}" \
              -o "dist/$name" ./cmd/jkp
          done
          cp scripts/install.sh dist/install.sh
          cp integrations/opencode/jkp.md dist/opencode-jkp.md
          cp integrations/claude/jkp.md dist/claude-jkp.md
          cp extensions/pi-jkp/index.ts dist/pi-jkp.ts
          # sha256sum format: <64-hex>  <name>  (two spaces)
          ( cd dist && sha256sum jkp-* > SHA256SUMS )
          echo "=== dist ==="
          ls -l dist/

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
